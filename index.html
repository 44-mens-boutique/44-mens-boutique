<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>44 Men's Boutique | ראשון לציון</title>
  <meta name="description" content="44 Men's Boutique - בוטיק גברים פרימיום בראשון לציון. אופנה גברית איכותית במחירים נגישים." />
  <meta property="og:title" content="44 Men's Boutique" />
  <meta property="og:description" content="בוטיק גברים פרימיום בראשון לציון 🖤" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --black: #0a0a0a;
      --dark: #111111;
      --white: #f5f5f5;
      --gray: #888;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Heebo', sans-serif;
      background: #111;
      color: var(--white);
      direction: rtl;
      overflow-x: hidden;
    }

    /* ── ANNOUNCEMENT BAR ── */
    .announcement-bar {
      background: linear-gradient(90deg, #0a0a0a 0%, #1a1400 40%, #0a0a0a 100%);
      color: var(--gold);
      text-align: center;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(201,168,76,0.4);
      overflow: hidden;
    }
    .announcement-bar span {
      display: inline-block;
      animation: marquee-banner 18s linear infinite;
    }
    @keyframes marquee-banner {
      0%   { transform: translateX(30%); opacity: 0; }
      8%   { opacity: 1; }
      45%  { transform: translateX(0%); }
      55%  { transform: translateX(0%); }
      92%  { opacity: 1; }
      100% { transform: translateX(-30%); opacity: 0; }
    }

    /* ── FLOATING NAV ── */
    .floating-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 2000;
      background: rgba(10,10,10,0.93);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(201,168,76,0.22);
      padding: 0.55rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transform: translateY(-110%);
      transition: transform 0.38s cubic-bezier(0.4,0,0.2,1);
    }
    .floating-nav.visible { transform: translateY(0); }
    .nav-logo { color: var(--gold); font-weight: 900; font-size: 1rem; letter-spacing: 0.1em; }

    /* ── HERO ── */
    .hero-section {
      position: relative;
      width: 100%;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      background: url('images/hero-bg.jpg') center center / cover no-repeat;
    }
    .hero-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
    }
    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeUp 0.8s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-box {
      border: 2px solid var(--gold);
      padding: 14px 28px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
    }
    .logo-44 {
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(90deg, #c9a84c 15%, #fff6c0 40%, #f5d060 55%, #c9a84c 80%);
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gold-shimmer 2.8s linear infinite;
    }
    .logo-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 4px;
      background: linear-gradient(90deg, #c9a84c 15%, #fff6c0 40%, #f5d060 55%, #c9a84c 80%);
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gold-shimmer 2.8s linear infinite;
      animation-delay: 0.5s;
    }
    @keyframes gold-shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    .shop-now-btn {
      background: rgba(15,15,15,0.78);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.35);
      padding: 1rem 3rem;
      font-family: 'Heebo', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      border-radius: 50px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.25s;
    }
    .shop-now-btn:hover {
      background: rgba(201,168,76,0.2);
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-2px);
    }

    /* ── CATEGORIES ── */
    .categories-section {
      display: flex;
      flex-direction: column;
    }

    .cat-tile {
      position: relative;
      width: 100%;
      height: 60vw;
      min-height: 220px;
      max-height: 420px;
      background-size: cover;
      background-position: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.3s;
    }
    .cat-tile::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.15) 60%, transparent 100%);
      transition: background 0.3s;
    }
    .cat-tile:hover::before {
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
    }
    .cat-tile-label {
      position: absolute;
      bottom: 1.4rem;
      left: 0; right: 0;
      text-align: center;
      color: #fff;
      font-size: clamp(1.4rem, 6vw, 2.4rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 16px rgba(0,0,0,0.7);
      z-index: 1;
      transition: transform 0.3s, color 0.3s;
    }
    .cat-tile:hover .cat-tile-label {
      color: var(--gold);
      transform: translateY(-4px);
    }
    .cat-tile.sale-tile::before {
      background: linear-gradient(to top, rgba(180,0,0,0.75) 0%, rgba(0,0,0,0.15) 60%, transparent 100%);
    }
    .cat-tile.sale-tile .cat-tile-label {
      color: #ff4444;
      text-shadow: 0 0 30px rgba(255,0,0,0.5);
    }
    .cat-tile.sale-tile:hover .cat-tile-label {
      color: #ff6666;
    }

    /* ── CONTACT ── */
    .contact {
      background: #111;
      padding: 4rem 1.5rem;
      text-align: center;
    }
    .section-title { margin-bottom: 2.5rem; }
    .section-title h2 { font-size: clamp(1.6rem, 5vw, 2.5rem); font-weight: 800; }
    .section-title h2 span { color: var(--gold); }
    .section-title p { color: var(--gray); margin-top: 0.6rem; }
    .gold-line { width: 50px; height: 2px; background: var(--gold); margin: 1rem auto 0; }

    .contact-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    .contact-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      color: var(--white);
      font-size: 1rem;
      text-decoration: none;
    }
    .ci {
      width: 42px; height: 42px;
      background: #1a1a1a;
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    .social-icons-row {
      display: flex; gap: 1.2rem;
      justify-content: center; align-items: center;
    }
    .social-icon-link {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: transform 0.2s, box-shadow 0.2s;
    }
    .social-icon-link:hover { transform: scale(1.12); }
    .si-wa  { background: #25d366; color: #fff; }
    .si-wa:hover  { box-shadow: 0 6px 22px rgba(37,211,102,0.55); }
    .si-ig  {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      color: #fff;
    }
    .si-ig:hover  { box-shadow: 0 6px 22px rgba(214,36,159,0.5); }
    .si-fb  { background: #1877f2; color: #fff; }
    .si-fb:hover  { box-shadow: 0 6px 22px rgba(24,119,242,0.5); }
    .si-tt  { background: #010101; color: #fff; border: 1.5px solid rgba(255,255,255,0.15); }
    .si-tt:hover  { box-shadow: 0 6px 22px rgba(105,201,208,0.5); }

    .btn-whatsapp {
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      background: linear-gradient(135deg, #25d366, #1ebe5d);
      color: #fff; text-decoration: none; border: none;
      padding: 1rem 1.5rem; border-radius: 50px;
      font-family: 'Heebo', sans-serif;
      font-size: 1.05rem; font-weight: 700;
      max-width: 320px; margin: 0 auto;
      transition: all 0.25s; cursor: pointer;
    }
    .btn-whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(37,211,102,0.4);
    }

    /* ── FOOTER ── */
    footer {
      background: #0a0a0a;
      border-top: 1px solid rgba(201,168,76,0.15);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    footer p { color: var(--gray); font-size: 0.8rem; }
    footer span { color: var(--gold); }

    /* ── FLOATING WA ── */
    .float-wa {
      position: fixed;
      bottom: 1.5rem; left: 1.5rem;
      width: 58px; height: 58px;
      background: #25d366;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem;
      box-shadow: 0 4px 20px rgba(37,211,102,0.5);
      z-index: 999; text-decoration: none;
      transition: transform 0.2s;
    }
    .float-wa:hover { transform: scale(1.1); }

    /* ── GALLERY MODAL ── */
    .grid-gallery-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9999;
      overflow-y: auto;
      padding: 3.5rem 1rem 2rem;
    }
    .grid-gallery-modal.open { display: block; }
    .grid-gallery-modal.detail-mode {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0;
    }
    .grid-gallery-modal.detail-mode .gallery-close { display: none; }

    .gallery-close {
      position: fixed;
      top: 1.2rem; left: 1.2rem;
      background: #1a1a1a;
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--white);
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer; z-index: 10000;
    }

    .grid-view-container { max-width: 700px; margin: 0 auto; }
    .grid-title { text-align: center; color: var(--gold); font-size: 1.5rem; font-weight: 800; margin-bottom: 1.2rem; }

    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.7rem;
    }
    @media (max-width: 400px) { .thumb-grid { grid-template-columns: repeat(2, 1fr); } }

    .thumb-item {
      aspect-ratio: 3/4;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.2s;
      position: relative;
      background: #1a1a1a;
    }
    .thumb-item:hover { border-color: var(--gold); transform: scale(1.03); }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-price {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.65);
      color: var(--gold);
      font-weight: 800; font-size: 0.85rem;
      text-align: center; padding: 0.3rem;
    }
    .thumb-cat { display: block; font-size: 0.7rem; font-weight: 500; opacity: 0.8; }

    .detail-view-container {
      display: flex; flex-direction: column;
      align-items: center; gap: 0.4rem;
      width: 100%; max-width: 500px;
      margin: 0 auto;
      padding: 2.5rem 1rem 0.6rem;
      height: 100%; overflow: hidden;
    }
    .back-btn {
      background: rgba(201,168,76,0.15);
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--gold);
      padding: 0.35rem 1rem;
      border-radius: 50px;
      font-family: 'Heebo', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      align-self: flex-start;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(201,168,76,0.3); }
    .detail-img-wrap { flex: 1; min-height: 0; width: 100%; position: relative; }
    .detail-img-wrap img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; display: block; }

    .nav-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.45);
      border: 1.5px solid rgba(201,168,76,0.5);
      color: var(--gold); width: 38px; height: 38px;
      border-radius: 50%; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 10; transition: background 0.2s;
    }
    .nav-arrow:hover { background: rgba(201,168,76,0.25); }
    .nav-arrow.prev { right: 8px; }
    .nav-arrow.next { left: 8px; }
    .nav-arrow:disabled { opacity: 0.2; cursor: default; }

    .order-options { width: 100%; max-width: 380px; flex-shrink: 0; }
    .size-label { color: var(--gold); font-weight: 700; font-size: 0.85rem; margin-bottom: 0.35rem; }
    .size-buttons { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
    .size-btn {
      padding: 0.4rem 0.85rem;
      border: 1.5px solid var(--gold);
      background: transparent; color: var(--gold);
      border-radius: 8px; cursor: pointer;
      font-family: 'Heebo', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      transition: all 0.2s;
    }
    .size-btn.selected { background: var(--gold); color: #000; }

    .gallery-wa-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      background: linear-gradient(135deg, #25d366, #1ebe5d);
      color: #fff; font-family: 'Heebo', sans-serif;
      font-size: 0.95rem; font-weight: 700;
      text-decoration: none; border-radius: 50px;
      padding: 0.65rem 1.2rem; width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
      flex-shrink: 0; border: none; cursor: pointer;
    }
    .gallery-wa-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(37,211,102,0.5); }
  </style>
</head>

  <!-- ── FLOATING WA ── -->
  <a href="https://wa.me/972504375644" class="float-wa" target="_blank">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="28" height="28"><path fill="#fff" d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157z"/></svg>

  <!-- ── GALLERY MODAL ── -->
  <div id="grid-gallery-modal" class="grid-gallery-modal" onclick="handleGridBgClick(event)">
    <button class="gallery-close" onclick="closeGridGallery()">✕</button>
    <div id="grid-view" class="grid-view-container">
      <h2 id="grid-title" class="grid-title"></h2>
      <div id="thumb-grid" class="thumb-grid"></div>
    </div>
    <div id="detail-view" class="detail-view-container" style="display:none">
      <button class="back-btn" onclick="backToGrid()">→ חזרה לקולקציה</button>
      <div class="detail-img-wrap">
        <img id="detail-img" src="" alt="" />
        <button class="nav-arrow next" id="nav-next" onclick="navigateDetail(-1)">‹</button>
        <button class="nav-arrow prev" id="nav-prev" onclick="navigateDetail(1)">›</button>
      </div>
      <div id="detail-price" style="color:var(--gold);font-weight:800;font-size:1.2rem;flex-shrink:0;"></div>
      <div class="order-options">
        <div class="size-label">בחר מידה:</div>
        <div id="size-buttons" class="size-buttons"></div>
      </div>
      <button onclick="sendOrderWA()" class="gallery-wa-btn">📲 הזמן בוואטסאפ</button>
    </div>
  </div>

  <script>
    const WA_NUMBER = '972504375644';
    const SIZES_CLOTHING = ['S', 'M', 'L', 'XL', 'XXL'];
    const SIZES_PANTS    = ['28', '30', '32', '34', '36', '38'];
    const SIZES_SHOES    = ['40', '41', '42', '43', '44', '45', '46'];

    let tshirtImages = [], suitImages = [], shortsImages = [], jeansImages = [], shoeImages = [], saleImages = [];
    let allItems = [];
    let currentGridImages = [];
    let currentItem = null;
    let selectedSize = '';
    let currentSizeList = [];
    let currentGalleryKey = '';
    let currentDetailIndex = 0;

    function buildAllItems() {
      function tag(arr, sizes, cat) {
        return arr.map(function(x) { return Object.assign({}, x, { sizes: sizes, category: cat }); });
      }
      allItems = [].concat(
        tag(tshirtImages, SIZES_CLOTHING, 'חולצות'),
        tag(suitImages,   SIZES_CLOTHING, 'חליפות'),
        tag(shortsImages, SIZES_PANTS,    'מכנסיים'),
        tag(jeansImages,  SIZES_PANTS,    'ג\'ינסים'),
        tag(shoeImages,   SIZES_SHOES,    'נעליים')
      );
    }

    fetch('products.json?v=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        tshirtImages = data.tshirts || [];
        suitImages   = data.suits   || [];
        shortsImages = data.shorts  || [];
        jeansImages  = data.jeans   || [];
        shoeImages   = data.shoes   || [];
        saleImages   = data.sale    || [];
        buildAllItems();
      })
      .catch(function() { buildAllItems(); });

    const GALLERY_REGISTRY = {
      all:     { getImages: function() { return allItems;     }, title: 'הקולקציה המלאה', sizes: SIZES_CLOTHING },
      tshirts: { getImages: function() { return tshirtImages; }, title: 'חולצות',         sizes: SIZES_CLOTHING },
      suits:   { getImages: function() { return suitImages;   }, title: 'חליפות',         sizes: SIZES_CLOTHING },
      shorts:  { getImages: function() { return shortsImages; }, title: 'מכנסיים',        sizes: SIZES_PANTS    },
      jeans:   { getImages: function() { return jeansImages;  }, title: 'ג\'ינסים',       sizes: SIZES_PANTS    },
      shoes:   { getImages: function() { return shoeImages;   }, title: 'נעליים',         sizes: SIZES_SHOES    },
      sale:    { getImages: function() { return saleImages.length ? saleImages : allItems; }, title: 'SALE 🔥', sizes: SIZES_CLOTHING },
    };

    function openCategoryGallery(key) {
      var entry = GALLERY_REGISTRY[key];
      if (!entry) return;
      currentGalleryKey = key;
      currentSizeList = entry.sizes;
      openGridGallery(entry.getImages(), entry.title);
    }

    function openAllItemsGallery() { openCategoryGallery('all'); }

    function buildSizeButtons(sizes) {
      selectedSize = '';
      var container = document.getElementById('size-buttons');
      container.innerHTML = '';
      sizes.forEach(function(s) {
        var btn = document.createElement('button');
        btn.className = 'size-btn';
        btn.textContent = s;
        btn.onclick = function() {
          document.querySelectorAll('.size-btn').forEach(function(b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
          selectedSize = s;
        };
        container.appendChild(btn);
      });
    }

    function sendOrderWA() {
      if (!currentItem) return;
      var imgUrl = 'https://44-mens-boutique.github.io/44-mens-boutique/' + currentItem.src;
      var msg = 'היי! ראיתי את *' + currentItem.name + '* באתר 44 Men\'s Boutique 🔥\n' +
        'מחיר: ' + currentItem.price + '\n';
      if (selectedSize) msg += 'מידה: *' + selectedSize + '*\n';
      msg += 'אשמח לדעת מה המלאי 🙏\n' + imgUrl;
      sessionStorage.setItem('waReturnGallery', currentGalleryKey);
      var a = document.createElement('a');
      a.href = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function openGridGallery(images, title) {
      currentGridImages = images;
      document.getElementById('grid-title').textContent = title;
      var grid = document.getElementById('thumb-grid');
      grid.innerHTML = '';
      if (!images.length) {
        grid.innerHTML = '<p style="text-align:center;color:#888;grid-column:1/-1;padding:2rem">אין פריטים בקטגוריה זו כרגע</p>';
      } else {
        images.forEach(function(item, i) {
          var div = document.createElement('div');
          div.className = 'thumb-item';
          div.onclick = function() { showDetail(i); };
          div.innerHTML = '<img src="' + item.src + '" alt="' + item.name + '" loading="lazy" />' +
            '<div class="thumb-price"><span class="thumb-cat">' + (item.category || '') + '</span>' + item.price + '</div>';
          grid.appendChild(div);
        });
      }
      document.getElementById('grid-view').style.display = 'block';
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('grid-gallery-modal').classList.add('open');
      document.getElementById('grid-gallery-modal').scrollTop = 0;
      document.body.style.overflow = 'hidden';
    }

    function showDetail(index) {
      currentDetailIndex = index;
      var item = currentGridImages[index];
      currentItem = item;
      document.getElementById('detail-img').src = item.src;
      document.getElementById('detail-price').innerHTML =
        (item.category ? '<span style="font-size:0.8rem;opacity:0.75;margin-left:6px;">' + item.category + '</span> ' : '') + item.price;
      buildSizeButtons(item.sizes || currentSizeList);
      document.getElementById('nav-prev').disabled = (index >= currentGridImages.length - 1);
      document.getElementById('nav-next').disabled = (index <= 0);
      document.getElementById('grid-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'flex';
      var modal = document.getElementById('grid-gallery-modal');
      modal.classList.add('detail-mode');
      modal.scrollTop = 0;
    }

    function navigateDetail(dir) {
      var next = currentDetailIndex + dir;
      if (next >= 0 && next < currentGridImages.length) showDetail(next);
    }

    function backToGrid() {
      var modal = document.getElementById('grid-gallery-modal');
      modal.classList.remove('detail-mode');
      document.getElementById('grid-view').style.display = 'block';
      document.getElementById('detail-view').style.display = 'none';
      modal.scrollTop = 0;
    }

    function closeGridGallery() {
      document.getElementById('grid-gallery-modal').classList.remove('open', 'detail-mode');
      document.body.style.overflow = '';
    }

    function handleGridBgClick(e) {
      if (e.target === document.getElementById('grid-gallery-modal')) closeGridGallery();
    }

    // שחזור גלריה כשחוזרים מוואטסאפ
    window.addEventListener('pageshow', function() {
      var key = sessionStorage.getItem('waReturnGallery');
      if (!key) return;
      sessionStorage.removeItem('waReturnGallery');
      var entry = GALLERY_REGISTRY[key];
      if (entry) openCategoryGallery(key);
    });

    // Floating nav
    (function() {
      var nav = document.getElementById('floating-nav');
      var hero = document.querySelector('.hero-section');
      window.addEventListener('scroll', function() {
        if (window.scrollY > (hero ? hero.offsetHeight * 0.6 : 300)) {
          nav.classList.add('visible');
        } else {
          nav.classList.remove('visible');
        }
      }, { passive: true });
    })();

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeGridGallery();
      if (e.key === 'ArrowLeft')  navigateDetail(-1);
      if (e.key === 'ArrowRight') navigateDetail(1);
    });

    var touchStartX = 0;
    document.getElementById('grid-gallery-modal').addEventListener('touchstart', function(e) {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    document.getElementById('grid-gallery-modal').addEventListener('touchend', function(e) {
      var diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50 && document.getElementById('detail-view').style.display !== 'none') {
        navigateDetail(diff > 0 ? -1 : 1);
      }
    }, { passive: true });
  </script>
